# Builds the website and the book with Quarto and publishes them to GitHub Pages.
#
# Code results are stored in site/_freeze and book/_freeze (render locally and
# commit them), so this workflow does not need R.
#
# One-time setup on GitHub: Settings > Pages > Build and deployment >
# Source: "GitHub Actions".

name: Publish website and book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website and book
        run: |
          quarto render
          cp -r _site/content/* _site/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
