project:
  type: website
  output-dir: ../_site
  # Copy the case-study data and the data package in from data/
  pre-render: copy_resources.ts
  resources:
    - downloads/

website:
  title: "From Data to Thesis"
  site-url: https://polla-fattah.github.io/R4NTR
  repo-url: https://github.com/polla-fattah/R4NTR
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Book
        href: book/index.html
      - text: Playground
        href: playground/index.qmd
      - text: Get the data
        href: index.qmd#get-the-data
    right:
      - icon: github
        href: https://github.com/polla-fattah/R4NTR
        aria-label: GitHub
  page-footer:
    left: "© Polla Fattah. *From Data to Thesis: Research Data Analysis with R*."
    right: "Built with [Quarto](https://quarto.org)"

execute:
  # Store computed results, so the site can be rebuilt without R
  freeze: auto

format:
  html:
    theme:
      light: [cosmo, styles/light.scss, styles/theme.scss]
      dark: [darkly, styles/dark.scss, styles/theme.scss]
    toc: true
