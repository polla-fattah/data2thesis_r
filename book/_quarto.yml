project:
  type: book
  # The book lives inside the website, at /book/
  output-dir: ../_site/book

book:
  title: "From Data to Thesis"
  subtitle: "Research Data Analysis with R"
  author: "Polla Fattah"
  site-url: https://polla-fattah.github.io/R4NTR/book
  repo-url: https://github.com/polla-fattah/R4NTR
  repo-subdir: book
  repo-actions: [edit, issue]
  search: true
  sidebar:
    style: docked
  navbar:
    left:
      - text: Home
        href: ../index.html
      - text: Book
        href: index.qmd
      - text: Playground
        href: ../playground/index.html
      - text: Get the data
        href: ../index.html#get-the-data
    right:
      - icon: github
        href: https://github.com/polla-fattah/R4NTR
        aria-label: GitHub
  chapters:
    - index.qmd
    - part: "Foundations of R Programming and Data Handling"
      chapters:
        - 01-getting-started.qmd
        - 02-data-structures.qmd
        - 03-data-manipulation.qmd
        - 04-data-visualization.qmd
    - part: "Statistical Analysis for Research"
      chapters:
        - 05-research-question.qmd
        - 06-descriptive-statistics.qmd
        - 07-hypothesis-testing.qmd
        - 08-anova-regression.qmd
        - 09-multivariate.qmd
        - 10-mixed-models.qmd
    - part: "Machine Learning with R"
      chapters:
        - 11-machine-learning.qmd
        - 12-classification.qmd
        - 13-predictive-regression.qmd
        - 14-advanced-clustering.qmd
        - 15-neural-networks.qmd
        - 16-time-series.qmd
    - part: "Reproducible Research and Applications"
      chapters:
        - 17-reproducible-research.qmd
        - 18-ai.qmd
        - 19-putting-it-together.qmd
    - references.qmd
  appendices:
    - a-installation.qmd
    - b-glossary.qmd
    - c-packages.qmd
    - d-common-errors.qmd
    - e-resources.qmd

bibliography: references.bib

execute:
  # Store computed results, so the book can be rebuilt without R
  freeze: auto
  warning: false
  message: false

format:
  html:
    theme:
      light: [cosmo, ../site/styles/light.scss, ../site/styles/theme.scss]
      dark: [darkly, ../site/styles/dark.scss, ../site/styles/theme.scss]
    code-link: true
    fig-align: center
    # Wider sidebar and text column, like the author's front-end book
    grid:
      sidebar-width: 320px
      body-width: 780px
      margin-width: 240px
    include-after-body:
      text: |
        <script>
          // Chapter titles are shortened to one line in the sidebar; show the full title on hover
          document.querySelectorAll(".sidebar-navigation .menu-text, .sidebar-navigation .sidebar-item-text")
            .forEach(function (el) { el.title = el.textContent.replace(/\s+/g, " ").trim(); });
        </script>
